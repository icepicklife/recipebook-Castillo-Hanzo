{% extends 'base.html' %}

{% load static %}

{% block title %}
Recipe Book
{% endblock %}

{% block content %}
    <h1>
        {{ recipe.name }}
    </h1>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.ingredient.name }} - {{ ingredient.quantity }}
        </li>
        {% endfor %}
    </ul>
{% endblock %}
