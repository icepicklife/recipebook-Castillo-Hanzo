{% extends 'base.html' %}

{% load static %}

{% block title %}
Recipe Book
{% endblock %}

{% load static %}

{% block content %}
    <h2>
        Recipe List
    </h2>
    <h3>
        <a href="{% url 'ledger:add_recipe' %}">Add New Recipe</a>
    </h3>
    <ul>
        {% for recipe in object_list %}
        <li>
            <a href="{{ recipe.get_absolute_url }}"> 
                {{ recipe.name }} 
            </a>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
